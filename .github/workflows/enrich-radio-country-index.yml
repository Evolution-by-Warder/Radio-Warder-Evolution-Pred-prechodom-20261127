name: Verify and enrich stable Warder Radio 224-country delta baseline
on:
  push:
    branches:
      - automation/radio-country-fortnightly-production-20261122
      - main
    paths:
      - .github/workflows/enrich-radio-country-index.yml
  pull_request:
    branches: [main]
    paths:
      - .github/scripts/enrich_country_index.py
      - .github/scripts/test_enrich_country_index.py
      - .github/workflows/enrich-radio-country-index.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: radio-224-stable-index-enrichment
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Test non-destructive 224-country enrichment and SHA mismatch rejection
        run: |
          python3 -m py_compile .github/scripts/enrich_country_index.py
          python3 -B .github/scripts/test_enrich_country_index.py
      - name: Download immutable 6.66 MB world metadata and verify all country identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/approved-world
          gh release download radio-country-20261122 \
            -p radio-countries-bouquets.zip -D build/approved-world
          python3 -B .github/scripts/enrich_country_index.py \
            --current assets/radio-country/latest.json \
            --world build/approved-world/radio-countries-bouquets.zip \
            --out build/approved-world/latest-complete.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          from zipfile import ZipFile
          a=json.loads(Path('build/approved-world/latest-complete.json').read_text())
          assert len(a['countries'])==224 and a['station_count']==48219
          assert sum(v['logos_found'] for v in a['countries'].values())==40837
          assert all(v['logo_attempted']==v['stations'] for v in a['countries'].values())
          print('224 country old+new SHA baseline: VERIFIED')
          PY
      - name: Publish metadata-only enrichment without replacing any release binary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --ff-only origin main
          cp build/approved-world/latest-complete.json assets/radio-country/latest.json
          git add assets/radio-country/latest.json
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Enrich approved radio country source index for safe 14-day delta checks [skip ci]'
            git push origin HEAD:main
          fi
          echo 'CURRENT WORLD SHA AND ALL 225 EXISTING RELEASE ASSETS UNCHANGED'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Warder-Radio-224-country-verified-delta-baseline
          path: build/approved-world/latest-complete.json
          retention-days: 30
          if-no-files-found: error
