name: RadaRadio public API source record structure check REVIEW
on:
  push:
    branches: [feature/radio-browser-country-bouquets-and-logo-zips-20261119]
    paths: [.github/workflows/radio-radaradio-record-contract-review.yml]
permissions:
  contents: read
jobs:
  read-only-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Report public read-only station response record keys and safe shortened examples
        run: |
          python3 - <<'PY'
          from urllib.request import Request,urlopen
          from urllib.parse import urlencode
          import json
          for cc in ('SK','DE','US','GB'):
              url='https://radaradio.com/api/radios?'+urlencode({'country':cc,'limit':4})
              try:
                  req=Request(url,headers={'User-Agent':'WarderRadioSourceContractReview/1.0','Accept':'application/json'})
                  with urlopen(req,timeout=10) as res:
                      data=json.load(res)
                  print('COUNTRY',cc,'RESPONSE',type(data).__name__,flush=True)
                  if isinstance(data,dict):
                      print('TOP KEYS',list(data.keys()),flush=True)
                      for k,v in data.items():
                          if isinstance(v,dict): print('NESTED',k,list(v.keys())[:30],flush=True)
                      arr=next((v for v in data.values() if isinstance(v,list)),[])
                      if not arr and isinstance(data.get('data'),dict):
                          arr=next((v for v in data['data'].values() if isinstance(v,list)),[])
                  else:arr=data if isinstance(data,list) else []
                  print('RECORDS',len(arr),flush=True)
                  for item in arr[:2]:
                      if not isinstance(item,dict):continue
                      print('STATION FIELDS', sorted(item),flush=True)
                      sample={k:(v[:120] if isinstance(v,str) else v if isinstance(v,(int,bool,float)) else list(v)[:10] if isinstance(v,dict) else str(type(v).__name__))
                          for k,v in item.items() if any(w in k.casefold() for w in ('stream','url','country','logo','image','favicon','name','title','web','home','station'))}
                      print('STATION SAMPLE',json.dumps(sample,ensure_ascii=False)[:1800],flush=True)
                      if item is arr[0] and item.get('id'):
                          detail_url='https://radaradio.com/api/radios/'+str(item['id'])
                          try:
                              with urlopen(Request(detail_url,headers={'User-Agent':'WarderRadioSourceContractReview/1.0','Accept':'application/json'}),timeout=10) as detail_res:
                                  detail=json.load(detail_res)
                              print('STATION DETAIL KEYS',sorted(detail) if isinstance(detail,dict) else type(detail).__name__,flush=True)
                              if isinstance(detail,dict):
                                  for k,v in detail.items():
                                      if isinstance(v,dict): print('DETAIL NESTED',k,list(v)[:30],flush=True)
                                      if any(p in k.casefold() for p in ('stream','url','home','website','link','source','audio')):
                                          print('DETAIL VAL',k,str(v)[:180],flush=True)
                          except Exception as e:
                              print('DETAIL ERROR',type(e).__name__,str(e)[:200],flush=True)
              except Exception as e:print('SOURCE ERROR',cc,type(e).__name__,str(e)[:200],flush=True)
          for cc in ('DE','US'):
              print('PAGING COUNTRY',cc,flush=True)
              for opts in ({'country':cc,'limit':250,'page':1},
                           {'country':cc,'limit':250,'page':2},
                           {'country':cc,'limit':250,'offset':250},
                           {'country':cc,'limit':1000,'page':1}):
                  try:
                      url='https://radaradio.com/api/radios?'+urlencode(opts)
                      with urlopen(Request(url,headers={'User-Agent':'WarderRadioSourceContractReview/1.0','Accept':'application/json'}),timeout=10) as res:
                          doc=json.load(res)
                      if isinstance(doc,list):vals=doc
                      elif isinstance(doc,dict):
                          vals=next((v for v in doc.values() if isinstance(v,list)),[])
                      else:vals=[]
                      print('PAGING SHAPE',opts,'count',len(vals),'firstIds',[x.get('id') for x in vals[:3] if isinstance(x,dict)],flush=True)
                  except Exception as e:print('PAGING ERROR',opts,type(e).__name__,str(e)[:130],flush=True)
          for query,country in (('Radio Expres','SK'),('1LIVE','DE'),('KEXP','US')):
              qurl='https://radaradio.com/api/radios?'+urlencode({'q':query,'country':country,'limit':30})
              try:
                  with urlopen(Request(qurl,headers={'User-Agent':'WarderRadioSourceContractReview/1.0','Accept':'application/json'}),timeout=12) as res:
                      search=json.load(res)
                  records=search if isinstance(search,list) else search.get('data',[])
                  print('NAME SEARCH',country,query,'count',len(records),
                        [(x.get('name'),x.get('country'),bool(x.get('logo'))) for x in records[:10]],flush=True)
              except Exception as e:print('NAME ERROR',country,query,type(e).__name__,str(e)[:150],flush=True)
          PY
